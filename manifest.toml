#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "misskey"
name = "Misskey"
description.en = "Microblogging platform"
description.fr = "Platforme de Microblogging"

version = "2026.7.0~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0"
website = "https://misskey-hub.net/"
code = "https://github.com/misskey-dev/misskey"
cpe = "cpe:2.3:a:misskey:misskey"
fund = "https://patreon.com/syuilo"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = false
sso = true

disk = "5G"
ram.build = "2G"
ram.runtime = "700M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    help.en = "If enabled, Misskey will be accessible by people who do not have an account. This can be changed later via the webadmin."
    help.fr = "Si cette case est cochée, Misskey sera accessible aux personnes n’ayant pas de compte. Vous pourrez changer ceci plus tard via la webadmin."
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    url = "https://github.com/misskey-dev/misskey/archive/refs/tags/2026.7.0.tar.gz"
    sha256 = "7a80a57cf500acfbb14427c8b186d94e0f0aabe47711f3bb19d41a374cc1468e"
    autoupdate.strategy = "latest_github_tag"

    [resources.sources.emojis]
    url = "https://github.com/misskey-dev/emojis/archive/50a35aacccecadc973247fbb1c070256d7039a9d.tar.gz"
    sha256 = "760d9ba8d5eb6a8f9b815f51605f5de0a85cb32d2632996d0c98674effc97134"
    autoupdate.upstream = "https://github.com/misskey-dev/emojis"
    autoupdate.strategy = "latest_github_commit"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = [
        "ffmpeg",
        "postgresql",
        "redis-server"
    ]

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "22"
